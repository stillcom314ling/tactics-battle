name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Download raylib WASM
        run: |
          wget -q https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_webassembly.zip
          unzip -q raylib-5.5_webassembly.zip

      - name: Download minshell
        run: wget -q -O minshell.html https://raw.githubusercontent.com/raysan5/raylib/5.5/src/minshell.html

      - name: Build
        run: |
          mkdir -p dist
          emcc game/main.c \
            -I raylib-5.5_webassembly/include \
            raylib-5.5_webassembly/lib/libraylib.a \
            -o dist/index.html \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s TOTAL_MEMORY=67108864 \
            -DPLATFORM_WEB \
            --shell-file minshell.html
