name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Download raylib WASM
        run: |
          wget -q https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_webassembly.zip
          unzip -q raylib-5.5_webassembly.zip

      - name: Download raygui
        run: |
          mkdir -p vendor
          wget -q -O vendor/raygui.h \
            https://raw.githubusercontent.com/raysan5/raygui/4.0/src/raygui.h

      - name: Build
        run: make
