name: Build and Deploy

on:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: List available workloads
        run: dotnet workload search

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools-net8

      - name: Restore
        run: dotnet restore RaylibGame/RaylibGame.csproj

      - name: Publish (browser-wasm)
        run: dotnet publish RaylibGame/RaylibGame.csproj -c Release -o publish/

      - name: Show publish output
        if: always()
        run: find publish/ -type f | sort || echo "(publish dir empty or missing)"

      - name: Upload publish tree for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: publish/
          if-no-files-found: warn

      - name: Locate web root (directory containing index.html)
        run: |
          INDEX=$(find publish/ -name "index.html" -print -quit)
          if [ -z "$INDEX" ]; then
            echo "ERROR: No index.html found under publish/"
            exit 1
          fi
          WEB_ROOT=$(dirname "$INDEX")
          echo "PAGES_DIR=$WEB_ROOT" >> $GITHUB_ENV
          echo "Deploying from: $WEB_ROOT"
          ls -la "$WEB_ROOT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - uses: actions/deploy-pages@v4
        id: deployment
