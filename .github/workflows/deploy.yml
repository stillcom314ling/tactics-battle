name: Build and Deploy

on:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Download raylib WASM
        run: |
          wget -q https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_webassembly.zip
          unzip -q raylib-5.5_webassembly.zip

      - name: Build
        run: |
          mkdir -p dist
          emcc game/main.c \
            -I raylib-5.5_webassembly/include \
            raylib-5.5_webassembly/lib/libraylib.a \
            -o dist/index.html \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s TOTAL_MEMORY=67108864 \
            -DPLATFORM_WEB \
            --shell-file game/shell.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
        id: deployment
