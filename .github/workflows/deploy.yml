name: Build and Deploy

on:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaylibGame/RaylibGame.csproj -r linux-x64

      - name: Build
        run: dotnet build RaylibGame/RaylibGame.csproj -c Release -r linux-x64 --no-restore

      - name: Publish (self-contained Linux x64)
        run: dotnet publish RaylibGame/RaylibGame.csproj -c Release -r linux-x64 --self-contained -o publish/ --no-restore

      - name: Copy landing page
        run: cp docs/index.html publish/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/

      - uses: actions/deploy-pages@v4
        id: deployment
